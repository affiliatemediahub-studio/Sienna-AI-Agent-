<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sienna AI Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500&display=swap');

  :root{
    --bg-deep:#0a0a0f;--bg-card:#12121a;--bg-elevated:#1a1a25;--accent:#e8b86d;--accent-soft:rgba(232,184,109,0.15);
    --text-primary:#f0f0f5;--text-secondary:#8a8a9a;--text-muted:#5a5a6a;--border:#2a2a3a;
    --success:#4ade80;--error:#f87171;--info:#60a5fa;--code-bg:#0d0d14;
    --sienna-gradient:linear-gradient(135deg,#c9a227,#e8b86d,#f4d03f);
    --glass:rgba(18,18,26,0.85);--shadow:0 4px 16px rgba(0,0,0,0.4);
    --input-bg:#1a1a25;--overlay-bg:rgba(10,10,15,0.96);--chip-bg:#1a1a25;--wave-opacity:1;
  }
  [data-theme="light"]{
    --bg-deep:#f5f5f7;--bg-card:#ffffff;--bg-elevated:#f0f0f5;--accent:#b8860b;--accent-soft:rgba(184,134,11,0.12);
    --text-primary:#1a1a1a;--text-secondary:#5a5a6a;--text-muted:#8a8a9a;--border:#e0e0e5;
    --success:#16a34a;--error:#dc2626;--info:#2563eb;--code-bg:#f8f8fa;
    --sienna-gradient:linear-gradient(135deg,#c9a227,#d4a017,#e8b86d);
    --glass:rgba(255,255,255,0.85);--shadow:0 4px 16px rgba(0,0,0,0.08);
    --input-bg:#ffffff;--overlay-bg:rgba(245,245,247,0.98);--chip-bg:#f0f0f5;--wave-opacity:0.6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Inter',sans-serif;background:var(--bg-deep);color:var(--text-primary);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background 0.4s,color 0.4s;}

  .header{background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;position:relative;transition:border-color 0.4s;}
  .logo-section{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:36px;height:36px;background:var(--sienna-gradient);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#1a1a1a;box-shadow:0 0 16px rgba(232,184,109,0.3);transition:box-shadow 0.4s;}
  [data-theme="light"] .logo-icon{box-shadow:0 0 12px rgba(184,134,11,0.25);}
  .logo-text h1{font-size:16px;font-weight:700;}
  .logo-text span{font-size:10px;color:var(--text-secondary);}
  .header-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn-sm{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;font-size:15px;}
  .icon-btn-sm:hover{border-color:var(--accent);color:var(--accent);}

  .mode-toggle{display:flex;background:var(--bg-elevated);border-radius:10px;padding:3px;border:1px solid var(--border);gap:2px;overflow-x:auto;max-width:52vw;scrollbar-width:none;}
  .mode-toggle::-webkit-scrollbar{display:none;}
  .mode-btn{padding:7px 12px;border:none;background:transparent;color:var(--text-secondary);font-size:11px;font-weight:600;border-radius:8px;cursor:pointer;transition:all 0.3s;font-family:'Inter',sans-serif;white-space:nowrap;}
  .mode-btn.active{background:var(--accent);color:#1a1a1a;box-shadow:0 2px 10px rgba(232,184,109,0.3);}
  [data-theme="light"] .mode-btn.active{box-shadow:0 2px 10px rgba(184,134,11,0.25);}

  .main-content{flex:1;overflow:hidden;position:relative;}
  .view{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;}
  .view.active{display:flex;}

  .chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .chat-area::-webkit-scrollbar{width:4px;}
  .message{max-width:88%;padding:12px 16px;border-radius:16px;font-size:13px;line-height:1.6;animation:msgIn 0.3s ease;word-wrap:break-word;}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .message.user{align-self:flex-end;background:var(--bg-elevated);border:1px solid var(--border);border-bottom-right-radius:4px;}
  .message.sienna{align-self:flex-start;background:linear-gradient(135deg,rgba(232,184,109,0.1),rgba(232,184,109,0.05));border:1px solid rgba(232,184,109,0.2);border-bottom-left-radius:4px;}
  [data-theme="light"] .message.sienna{background:var(--accent-soft);border-color:rgba(184,134,11,0.2);}
  .message.sienna .msg-label{font-size:10px;font-weight:700;color:var(--accent);margin-bottom:3px;display:flex;align-items:center;gap:5px;}
  .msg-label::before{content:'';width:5px;height:5px;background:var(--accent);border-radius:50%;box-shadow:0 0 6px var(--accent);}
  .new-chat-wrap{display:flex;justify-content:center;padding:10px 0;}
  .new-chat-btn{padding:8px 20px;border-radius:20px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .new-chat-btn:hover{border-color:var(--accent);color:var(--accent);}
  .input-area{padding:12px 16px 18px;background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;transition:border-color 0.4s;}
  .chat-input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text-primary);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s,background 0.4s;}
  .chat-input:focus{border-color:var(--accent);}
  .icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;font-size:16px;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}
  .icon-btn.recording{background:rgba(248,113,113,0.2);border-color:var(--error);color:var(--error);animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.4);}50%{box-shadow:0 0 0 10px rgba(248,113,113,0);}}
  .send-btn{background:var(--sienna-gradient);color:#1a1a1a;border:none;font-weight:700;}

  .spanish-header{padding:16px;text-align:center;background:linear-gradient(180deg,rgba(232,184,109,0.08),transparent);}
  .spanish-header h2{font-size:20px;font-weight:800;background:var(--sienna-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .spanish-header p{color:var(--text-secondary);font-size:12px;}
  .stats-bar{display:flex;justify-content:center;gap:12px;padding:6px 16px;font-size:10px;color:var(--text-muted);}
  .lesson-progress{display:flex;justify-content:center;gap:6px;padding:8px 16px;flex-wrap:wrap;}
  .lesson-chip{padding:5px 12px;border-radius:16px;font-size:11px;font-weight:600;background:var(--chip-bg);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;transition:all 0.2s;}
  .lesson-chip.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent);}
  .lesson-chip.completed{border-color:var(--success);color:var(--success);}
  .lesson-area{flex:1;overflow-y:auto;padding:0 16px 16px;}
  .lesson-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;position:relative;transition:background 0.4s,border-color 0.4s;}
  .lesson-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--sienna-gradient);}
  .spanish-word{font-family:'Noto Serif',serif;font-size:32px;font-weight:700;color:var(--accent);margin:10px 0 6px;}
  .english-word{font-size:16px;color:var(--text-secondary);font-weight:500;}
  .phonetic{font-size:13px;color:var(--text-muted);font-style:italic;margin-bottom:16px;}
  .example-sentence{background:var(--bg-elevated);border-radius:10px;padding:12px;margin:12px 0;border-left:3px solid var(--accent);transition:background 0.4s;}
  .example-sentence .es{font-size:14px;font-weight:600;}
  .example-sentence .en{font-size:12px;color:var(--text-secondary);margin-top:3px;}
  .feedback-area{min-height:36px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;border-radius:10px;padding:8px;transition:all 0.3s;}
  .feedback-area.correct{background:rgba(74,222,128,0.1);color:var(--success);}
  .feedback-area.wrong{background:rgba(248,113,113,0.1);color:var(--error);}
  .feedback-area.listening{background:rgba(96,165,250,0.1);color:var(--info);}
  .controls-row{display:flex;gap:10px;justify-content:center;padding:0 16px 16px;}
  .big-btn{flex:1;max-width:140px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-primary);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .big-btn .btn-icon{font-size:20px;}
  .big-btn:hover{border-color:var(--accent);transform:translateY(-2px);}
  .big-btn.primary{background:var(--sienna-gradient);color:#1a1a1a;border:none;box-shadow:0 4px 16px rgba(232,184,109,0.3);}
  [data-theme="light"] .big-btn.primary{box-shadow:0 4px 16px rgba(184,134,11,0.2);}
  .big-btn.primary.recording{background:linear-gradient(135deg,#ef4444,#f87171);box-shadow:0 4px 16px rgba(239,68,68,0.3);animation:pulse 1.5s infinite;}
  .nav-row{display:flex;justify-content:space-between;padding:0 16px 16px;gap:10px;}
  .nav-btn{padding:8px 20px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .nav-btn:hover{border-color:var(--accent);color:var(--accent);}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .voice-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:24px;margin:6px 0;}
  .voice-wave span{width:3px;background:var(--accent);border-radius:2px;animation:wave 1s ease-in-out infinite;opacity:var(--wave-opacity);}
  .voice-wave span:nth-child(1){height:6px;animation-delay:0s;}.voice-wave span:nth-child(2){height:12px;animation-delay:0.1s;}.voice-wave span:nth-child(3){height:20px;animation-delay:0.2s;}.voice-wave span:nth-child(4){height:12px;animation-delay:0.3s;}.voice-wave span:nth-child(5){height:6px;animation-delay:0.4s;}
  @keyframes wave{0%,100%{transform:scaleY(0.5);opacity:0.5;}50%{transform:scaleY(1);opacity:1;}}
  .voice-wave.active span{animation-play-state:running;}.voice-wave.paused span{animation-play-state:paused;opacity:0.3;}

  .builder-header{padding:16px;text-align:center;background:linear-gradient(180deg,rgba(232,184,109,0.08),transparent);}
  .builder-header h2{font-size:20px;font-weight:800;background:var(--sienna-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .builder-types{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;}
  .builder-type{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
  .builder-type.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .builder-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text-primary);font-size:13px;outline:none;resize:none;min-height:70px;font-family:'Inter',sans-serif;transition:background 0.4s,border-color 0.2s;}
  .builder-input:focus{border-color:var(--accent);}
  .builder-actions{display:flex;gap:10px;padding:0 16px 12px;}
  .builder-btn{flex:1;padding:12px;border-radius:10px;border:none;background:var(--sienna-gradient);color:#1a1a1a;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
  .builder-btn.secondary{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);transition:all 0.2s;}
  .code-block{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:'Fira Code',monospace;font-size:11px;line-height:1.5;color:#a0a0b0;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow-y:auto;transition:background 0.4s;}
  .preview-frame{width:100%;height:220px;border:1px solid var(--border);border-radius:10px;background:#fff;}
  .project-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;transition:background 0.4s;}
  .project-card .title{font-weight:700;font-size:13px;}
  .project-card .meta{font-size:10px;color:var(--text-muted);}
  .project-card button{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-size:11px;cursor:pointer;transition:all 0.2s;}
  .tabs{display:flex;gap:6px;padding:0 16px 10px;}
  .tab{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .tab.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent);}

  .knowledge-header{padding:16px;text-align:center;background:linear-gradient(180deg,rgba(232,184,109,0.08),transparent);}
  .knowledge-header h2{font-size:20px;font-weight:800;background:var(--sienna-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .knowledge-header p{color:var(--text-secondary);font-size:12px;}
  .knowledge-input-area{padding:0 16px 12px;}
  .knowledge-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text-primary);font-size:13px;outline:none;resize:none;min-height:100px;font-family:'Inter',sans-serif;transition:background 0.4s;}
  .knowledge-input:focus{border-color:var(--accent);}
  .knowledge-title-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text-primary);font-size:13px;outline:none;margin-bottom:8px;transition:background 0.4s;}
  .knowledge-actions{display:flex;gap:10px;padding:0 16px 12px;}
  .knowledge-btn{flex:1;padding:12px;border-radius:10px;border:none;background:var(--sienna-gradient);color:#1a1a1a;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
  .knowledge-btn.secondary{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);transition:all 0.2s;}
  .knowledge-list{flex:1;overflow-y:auto;padding:0 16px 16px;}
  .knowledge-item{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;transition:background 0.4s;}
  .knowledge-item .title{font-weight:700;font-size:13px;color:var(--accent);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
  .knowledge-item .meta{font-size:10px;color:var(--text-muted);margin-bottom:6px;}
  .knowledge-item .preview{font-size:12px;color:var(--text-secondary);line-height:1.5;max-height:60px;overflow:hidden;}
  .knowledge-item .actions{display:flex;gap:6px;margin-top:8px;}
  .knowledge-item button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .knowledge-item button:hover{border-color:var(--accent);color:var(--accent);}
  .study-area{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:20px;margin:0 16px 16px;text-align:center;transition:background 0.4s;}
  .study-question{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--text-primary);}
  .study-answer{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text-primary);font-size:14px;outline:none;margin-bottom:12px;transition:background 0.4s;}
  .study-feedback{font-size:14px;font-weight:600;margin-bottom:12px;min-height:24px;}
  .empty-state{text-align:center;padding:30px 16px;color:var(--text-muted);font-size:13px;}
  .file-upload{display:flex;align-items:center;gap:8px;padding:0 16px 12px;}
  .file-upload input[type="file"]{display:none;}
  .file-upload label{padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .file-upload label:hover{border-color:var(--accent);color:var(--accent);}
  .badge-inline{font-size:10px;background:rgba(96,165,250,0.15);color:var(--info);padding:2px 8px;border-radius:10px;border:1px solid rgba(96,165,250,0.3);}

  /* SETTINGS */
  .settings-header{padding:16px;text-align:center;background:linear-gradient(180deg,rgba(232,184,109,0.08),transparent);}
  .settings-header h2{font-size:20px;font-weight:800;background:var(--sienna-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .settings-header p{color:var(--text-secondary);font-size:12px;}
  .settings-area{flex:1;overflow-y:auto;padding:0 16px 16px;}
  .settings-group{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;transition:background 0.4s,border-color 0.4s;}
  .settings-group h3{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;}
  .setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
  .setting-row:last-child{border-bottom:none;padding-bottom:0;}
  .setting-row:first-child{padding-top:0;}
  .setting-label{font-size:13px;color:var(--text-primary);font-weight:500;}
  .setting-desc{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .toggle-switch{position:relative;width:48px;height:26px;background:var(--bg-elevated);border-radius:13px;border:1px solid var(--border);cursor:pointer;transition:all 0.3s;}
  .toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--text-secondary);border-radius:50%;transition:all 0.3s;}
  .toggle-switch.active{background:var(--accent);border-color:var(--accent);}
  .toggle-switch.active::after{background:#1a1a1a;transform:translateX(22px);}
  .setting-select{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text-primary);font-size:12px;font-family:'Inter',sans-serif;outline:none;min-width:120px;}
  .setting-select:focus{border-color:var(--accent);}
  .setting-input{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text-primary);font-size:12px;font-family:'Inter',sans-serif;outline:none;width:120px;text-align:right;}
  .setting-input:focus{border-color:var(--accent);}
  .personality-presets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .preset-chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .preset-chip:hover{border-color:var(--accent);color:var(--accent);}
  .preset-chip.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent);}
  .danger-btn{width:100%;padding:10px;border-radius:10px;border:1px solid var(--error);background:rgba(248,113,113,0.08);color:var(--error);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;margin-top:8px;transition:all 0.2s;}
  .danger-btn:hover{background:rgba(248,113,113,0.15);}
  .export-btn{width:100%;padding:10px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-family:'Inter',sans-serif;font-size:12px;fo
